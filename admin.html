<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Booking Admin</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    table { border-collapse: collapse; width: 100%; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background: #f8d8e6; }
    h1 { margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>All Bookings</h1>
  <table>
    <tr>
      <th>ID</th>
      <th>Name</th>
      <th>Address</th>
      <th>Service</th>
      <th>Date</th>
      <th>Created At</th>
    </tr>
    {% for b in bookings %}
    <tr>
      <td>{{ b[0] }}</td>
      <td>{{ b[1] }}</td>
      <td>{{ b[2] }}</td>
      <td>{{ b[3] }}</td>
      <td>{{ b[4] }}</td>
      <td>{{ b[5] }}</td>
    </tr>
    {% endfor %}
  </table>
</body>
</html>
